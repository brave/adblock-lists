name: YouTube RPNT update alert

on:
  # schedule: # run every 3 hours
  #   - cron: "0 */3 * * *"
  workflow_dispatch: # manual run button

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      # true when uAssets changed the rpnt rule and a commit was pushed
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"

      - name: Regenerate yt-rpnt exception
        run: python scripts/sync_yt_rpnt_exception.py

      # gh pr create cannot push uncommitted changes: without this step the
      # regenerated brave-unbreak.txt is lost when the job ends and the PR is
      # created from whatever the auto/ branch already contains.
      - name: Commit and push to auto branch
        id: commit
        run: |
          if git diff --quiet -- brave-unbreak.txt; then
            echo "No change — nothing to push"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add brave-unbreak.txt
            git commit -m "Sync brave-unbreak.txt with uAssets quick-fixes"
            git fetch origin refs/heads/auto/sync-yt-rpnt-exception:refs/remotes/origin/auto/sync-yt-rpnt-exception || true  # update the lease ref when the branch exists
            git push --force-with-lease origin HEAD:auto/sync-yt-rpnt-exception
          fi

      - name: Open PR if changed
        run: |
          if git diff --quiet "$GITHUB_SHA" HEAD; then
             exit 0
          fi
          gh pr view auto/sync-yt-rpnt-exception >/dev/null 2>&1 || gh pr create \
            --title "Sync brave-unbreak.txt with uAssets quick-fixes" \
            --body "Automated update after a change to the matching \`rpnt\` rule in uAssets \`filters/quick-fixes.txt\`." \
            --base master \
            --head auto/sync-yt-rpnt-exception
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  alert:
    runs-on: ubuntu-latest
    needs:
      - sync
    if: ${{ always() && needs.sync.outputs.changed == 'true' }}
    permissions: {}
    steps:
      - name: Notify Slack of upstream rpnt change
        uses: 8398a7/action-slack@28ba43ae48961b90635b50953d216767a6bea486 # v3.16.2
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          author_name: "Github Actions"
          status: success
          fields: repo,message,commit,author,eventName,ref,workflow
          text: "<!subteam^${{ secrets.UBO_SYNC_REVIEWERS_SLACK_GROUP_ID }}> uAssets changed the rpnt quick-fix rule; a commit to apply an exception rule was generated for ${{ github.repository }}. Review/merge the PR: ${{ github.server_url }}/${{ github.repository }}/pull/auto/sync-yt-rpnt-exception — run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"